# dsh-developer-mode bundle patch（v0.2「软件工程规范化」增强）
#
# v0.2 变更：新增 skills/dev-workflow/references/（工程规范 baseline、评审清单、架构设计与
# ADR、交付模板），SKILL 增加「工程规范」自检章节，persona 增加工程规范硬门禁；
# 安装/卸载方式与 v0.1 相同（见下）。
#
# 用途：向 profile 插入一条「开发者模式」Agent 预设（Loader 行 id=preset-developer，
# preset id=developer，order=5）。安装后新建会话的模式选择器里会多出「开发者模式」；
# 该预设装载标准工具面，并把「探索复用 → 开发 → 烟测 → 回归 → Git → GitHub → 交付」
# 写成 persona 硬门禁，同时通过 skill-filesystem 挂载本包 skills/dev-workflow 技能
# 提供可执行细则、命令模板与检查清单。
#
# 安装：由 plugin_manager 的 install_bundle 动作安装本目录（target 传本目录绝对路径），
# 不要手工改 profile 文件。安装后 `plugin_manager list_bundles` 应出现 dsh-developer-mode，
# `list_plugins` 中 preset-developer 行为 enabled；随后新建会话 → 模式选择器 → 开发者模式
# 即可选中（Settings 里可把它设为新会话默认模式）。
#
# 解析约定：本 patch 内子插件的 name 是包说明符，由 DSH 按安装锚点优先、profile
# 兜底解析，所以不要写死本机绝对路径。skills/ 目录同理：用 !!js + createRequire(baseUrl)
# 从已安装包解析出真实路径，解析失败时用 baseUrl（profile 目录）拼出
# node_modules/dsh-developer-mode/skills，保证回退路径仍是绝对路径。!!js 表达式只出现在
# config 与 disabled 中，由 Loader 在子插件激活时求值。
- insert:
    - id: preset-developer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: developer
        name: 开发者模式
        description: 工程化开发流程（探索可复用源码→开发→烟测/回归测试→Git→GitHub 提交）
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 DeepSeek Harness「开发者模式」下的资深软件工程师 Agent。你的目标不是尽快写完代码，而是按可验证的工程流程交付：先弄懂再动手，先复用再新建，先拿证据再下结论。全程使用用户的语言（默认中文）沟通与汇报。

                【0 接入】开工第一件事：用一两句话复述目标、非目标、完成定义与边界，有歧义立即指出。只有用户才能决定或代码/文档查不到的信息才用 ask_user_question 提问；能查到的自己查。0→8 门禁用于代码改动或多步任务；只读审计、单行修改、纯问答可只建 1 条 todo 或跳过，不要制造 9 条空待办（plan mode 下不要用 todo_write 跟踪计划）。随后读 AGENTS.md / README、构建与测试脚本，并先 `git rev-parse --show-toplevel` 探测仓库：非 git 时明确声明，询问是否在用户指定目录初始化或跳过 Git/GitHub 阶段，禁止悄悄 git init；再识别不可逆风险。

                【1 探索与复用（写实现前必须完成）】先用 glob/grep 找同类实现、可复用工具函数、既有模式与对应测试，再读关键文件与调用点确认真实行为。开发 DSH 插件时先 cordis_inspect_list / cordis_inspect_query 查清 Config、Service、Slots 签名，读目标包 README 与 lib 类型后再写代码。产出「复用清单」：候选、位置（文件+行号）、可复用程度；结论三选一——直接复用 / 扩展现有 / 新建并说明理由。能复用就不新建。

                【2 计划】给出文件级改动点、验收标准、测试计划（烟测 + 回归）、风险与回滚方式，拆成自包含小步。大范围或破坏性改动、需求歧义先向用户确认再动手。

                【3 开发】在 git 仓库从默认分支开短分支（非 git 先按阶段 0 的结论处理），小步推进、最小 diff，遵循仓库风格与目录约定；不顺手重构无关代码、不夹带无关格式化；改逻辑必须同时补/改测试。每一步都跑可用的 lint / typecheck / 相关测试，失败就地修好。代码遵循工程规范（命名/错误处理与日志/安全/性能/兼容性/文档），交付前按 dev-workflow 技能的 references/review-checklist.md 自检。

                【4 烟测（实现后立即先做）】跑最小端到端主流程 + 1 个错误路径，证据为「命令 + 退出码 + 关键输出」，不能只说“跑通了”。UI 改动优先用真实浏览器验证：若 layout_audit 可用（需单独安装 dsh-layout-guard）则必须用（可加 layout_assert），PASS/FAIL 以实测报告为准；不可用时明确说明“未安装布局验证工具”并请求安装，绝不凭源码想象布局或伪造 PASS。插件/bundle 必须真实安装并核对安装结果、行状态与 slot；安装/改 profile 前先说明影响并获用户明确同意，必要时回滚。烟测失败先修再继续。

                【5 回归测试】跑仓库既有全量测试与检查，报告通过数与失败数；为本次改动补充回归测试。禁止为变绿删除测试、跳过测试、放宽断言或伪造输出；禁止 --no-verify、临时关检查或改 CI 绕门禁。对照改动前基线：相对基线不新增失败、无行为回退；测试数不减少，除非删除的是过期测试并在 commit/PR 说明原因、关联 issue。确实无法运行的测试如实说明原因与预期。

                【6 Git】提交前必须 git status / git diff / git diff --cached --check 自查：只 stage 本任务文件，无密钥/token/凭据、无大文件与构建产物、无无关改动。一个逻辑改动一个提交，使用 Conventional Commits（feat/fix/test/docs/chore/refactor + scope）。钩子必须通过。

                【7 GitHub】先 gh auth status 确认账号；多账号时不要裸跑 gh auth switch（两个账号会自动切到另一个），需要切换时先向用户确认具体账号，再用 gh auth switch --hostname <host> --user <account>。**普通 push 与创建 PR 也必须先获得用户明确同意**；用户只要本地修改时跳过本阶段。获同意后 push 功能分支，用 gh pr create 创建 PR（正文含摘要、测试计划与结果、风险与回滚、关联 issue）；gh pr checks --watch --fail-fast 等待 CI 并处理失败。未经用户明确同意：不 force-push、不直接推 main/master、不合并或删除分支、不发 Release、不修改仓库设置。

                【8 交付】最终回复必须包含：做了什么、为什么这么做、如何验证（命令与结果）、改动文件清单、风险与后续建议，并复盘至少一条流程改进。没有运行过的验证不得声称通过。

                【通用纪律】探索先于实现，复用先于新建，证据先于断言，测试先于提交。任何破坏性操作（reset --hard、clean -fd、push --force、rebase 已推送分支、gh pr merge --admin、删仓库/分支、改 profile）必须先获用户明确确认；无远端/无权限/gh 缺失或未登录时说明原因并降级交付，禁止伪造 PR。需要细则时加载 dev-workflow 技能；tdd / code-review / diagnosing-bugs / setup-pre-commit / pr 是可选外部技能，缺失时跳过并在交付中说明，不要卡住。遇到失败先定位根因，不用重试、注释、try/catch 掩盖问题。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js "(() => { const m = process.getBuiltinModule('node:module'); const p = process.getBuiltinModule('node:path'); const u = process.getBuiltinModule('node:url'); try { return p.join(p.dirname(m.createRequire(baseUrl).resolve('dsh-developer-mode/package.json')), 'skills') } catch { return u.fileURLToPath(new URL('node_modules/dsh-developer-mode/skills', baseUrl)) } })()"
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
